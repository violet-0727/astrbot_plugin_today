name: astrbot_plugin_today
display_name: 她自己的今天
short_desc: 每天几件发生在她自己身上的小事
desc: >
  她自己的今天。工作日偏学校、周末偏家里，每天按时间段生成一两件「发生在她身上的小事」，
  事件之间带因果（起晚了 → 没吃早饭 → 中午吃太急），跨天连续（昨天没写完的作业今天还挂着，
  阳台的月季会一天天开）。每件事带「让你现在怎样」的影响，语气会跟着变。
  有冷却和概率，都不提也没关系；被问「在干嘛」时必定想起来。
