<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>她自己的今天</title>
<style>
  :root{
    --bg:#eef3fa; --panel:#fff; --fg:#16202e; --muted:#6b7c93; --line:#dbe4f0; --field:#f6f9fe;
    --accent:#2f6feb; --accent2:#63a4ff; --soft:#e8f0ff; --ok:#1f9d6b; --warn:#c2410c; --gold:#c08a3e;
    --sh:0 1px 2px rgba(22,45,90,.06), 0 12px 28px -16px rgba(22,45,90,.22);
  }
  [data-theme="dark"]{
    --bg:#0b1119; --panel:#111a26; --fg:#e6eefb; --muted:#8ea2bd; --line:#1e2b3d; --field:#0f1722;
    --accent:#64a0ff; --accent2:#3d7ce0; --soft:#14233a; --ok:#4ade80; --warn:#fb923c; --gold:#d8a866;
    --sh:0 1px 2px rgba(0,0,0,.5), 0 16px 36px -22px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 90px}

  .hero{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;margin-bottom:16px}
  .hero h1{margin:0 0 4px;font-size:21px}
  .hero p{margin:0;color:var(--muted);font-size:13px}
  .hero .sp{flex:1}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:11.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .chip.kind{color:var(--accent);border-color:var(--accent);background:var(--soft)}
  .chip.said{color:var(--ok);border-color:var(--ok)}
  .chip.pending{color:var(--gold);border-color:var(--gold)}

  button{font:inherit;cursor:pointer;border-radius:10px;padding:8px 14px;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);transition:.15s;white-space:nowrap}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.mini{padding:5px 10px;font-size:12px;border-radius:8px}
  button.ghost{background:transparent}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));margin-bottom:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh);
    display:flex;flex-direction:column}
  .card h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:flex-start}
  .card .slot{font-size:12px;color:var(--muted);flex:none}
  .card .txt{font-size:14.5px;line-height:1.7}
  .card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .card .foot{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
  .card.said{opacity:.72}

  .sec{margin-top:22px}
  .sec h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:1.2px;
    text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .sec h3::after{content:"";flex:1;height:1px;background:var(--line)}

  .pend{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
    padding:6px 16px}
  .prow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .prow:last-child{border-bottom:0}
  .prow .box{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);flex:none;cursor:pointer;
    display:grid;place-items:center;color:transparent;font-size:11px}
  .prow .box.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .prow.done .txt{color:var(--muted);text-decoration:line-through}
  .prow .txt{flex:1}

  .threads{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .th{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
  .th .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .th b{font-size:13.5px}
  .th .stage{font-size:12.5px;color:var(--muted);margin-top:6px}
  .th .track{margin-top:10px;height:5px;border-radius:99px;background:var(--field);overflow:hidden}
  .th .track i{display:block;height:100%;border-radius:99px;background:var(--accent2)}

  .hist{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
    padding:6px 16px}
  .hrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .hrow:last-child{border-bottom:0}
  .hrow .d{flex:none;width:78px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .hrow .t{flex:1;min-width:0;color:var(--fg)}
  .hrow .t .dim{color:var(--muted);opacity:.75}

  .addbox{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .addbox input{flex:1 1 260px;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);outline:none}
  .addbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}

  .empty{color:var(--muted);font-size:13px;padding:26px 16px;text-align:center}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 16px;border-radius:10px;
    box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.2s;font-size:13px;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.error{border-left-color:var(--warn)}
  .banner{display:none;margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--soft);
    color:var(--accent);font-size:13px}
  .banner.show{display:block}
  @media(max-width:640px){.wrap{padding:18px 14px 80px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>她自己的今天</h1>
      <p>她自己的一天，不是围绕谁转的。工作日大多在学校，周末在家浇花画画。</p>
    </div>
    <div class="sp"></div>
    <div class="btns">
      <button class="primary" id="btn-reroll">换一批</button>
      <button class="ghost" id="btn-add-toggle">＋ 添一件</button>
      <button class="ghost" id="btn-refresh">刷新</button>
    </div>
  </div>

  <div class="banner" id="banner">面板桥接还没就绪，正在重试…</div>

  <div class="addbox" id="addbox" hidden>
    <input id="add-input" placeholder="例：阳台的风很大，把晾着的衣服吹掉了" />
    <button class="primary" id="btn-add-save">记下</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>今天还没有什么特别的事。</div>

  <div class="sec">
    <h3>还挂着的事</h3>
    <div class="pend" id="pend"></div>
  </div>

  <div class="sec">
    <h3>跨天的长线</h3>
    <div class="threads" id="threads"></div>
  </div>

  <div class="sec">
    <h3>最近七天</h3>
    <div class="hist" id="hist"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const API = "/astrbot_plugin_today";
  let bridge = null;
  let state = null;

  const $ = (id) => document.getElementById(id);
  const ep = (p) => String(p || "").replace(/^\/+/, "");

  async function ensureBridge() {
    if (window.AstrBotPluginPage) { bridge = window.AstrBotPluginPage; return true; }
    const t0 = Date.now();
    while (Date.now() - t0 < 6000) {
      await new Promise((r) => setTimeout(r, 60));
      if (window.AstrBotPluginPage) { bridge = window.AstrBotPluginPage; return true; }
    }
    return false;
  }
  function get(path) {
    if (bridge && bridge.apiGet) return bridge.apiGet(ep(path));
    return fetch("/api/plug" + API + path, { credentials: "include" }).then((r) => r.json());
  }
  function post(path, body) {
    if (bridge && bridge.apiPost) return bridge.apiPost(ep(path), body);
    return fetch("/api/plug" + API + path, {
      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then((r) => r.json());
  }
  function toast(msg, bad) {
    const el = $("toast");
    el.textContent = msg;
    el.className = "toast show" + (bad ? " error" : "");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => (el.className = "toast"), 2400);
  }
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function render() {
    if (!state) return;
    const events = state.events || [];
    $("empty").hidden = events.length > 0;
    $("grid").hidden = events.length === 0;
    $("grid").innerHTML = events.map((e) => {
      const said = !!e.said;
      return '<div class="card' + (said ? " said" : "") + '" data-id="' + esc(e.id) + '">'
        + '<h3><span>' + esc(e.text) + '</span></h3>'
        + '<div class="meta"><span class="chip">' + esc(e.slot_label || "全天") + '</span>'
        + (e.effect ? '<span class="chip">' + esc(e.effect) + '</span>' : '')
        + '<span class="chip ' + (said ? "said" : "pending") + '">' + (said ? "提过了" : "还没提") + '</span>'
        + '</div>'
        + '<div class="foot">' + (said ? '' : '<button class="mini" data-act="said">标记已提</button>')
        + '</div></div>';
    }).join("");

    const pending = state.pending || [];
    $("pend").innerHTML = pending.length ? pending.map((p) =>
      '<div class="prow' + (p.done ? " done" : "") + '" data-id="' + esc(p.id) + '">'
      + '<span class="box' + (p.done ? " on" : "") + '" data-act="done">✓</span>'
      + '<span class="txt">' + esc(p.text) + '</span>'
      + (p.carried ? '<span class="chip">昨天起</span>' : '')
      + '</div>').join("") : '<div class="empty">没有挂着的事</div>';

    const threads = state.threads || [];
    $("threads").innerHTML = threads.map((th) => {
      const pct = th.total ? Math.round((th.index / th.total) * 100) : 0;
      return '<div class="th"><div class="top"><b>' + esc(th.name) + '</b><span class="chip">'
        + th.index + ' / ' + th.total + '</span></div>'
        + '<div class="stage">' + esc(th.stage) + '</div>'
        + '<div class="track"><i style="width:' + pct + '%"></i></div></div>';
    }).join("");

    const hist = (state.history || []).slice().reverse();
    $("hist").innerHTML = hist.length ? hist.map((d) => {
      const texts = (d.events || []).map((e) =>
        e.said ? esc(e.text) : '<span class="dim">' + esc(e.text) + '</span>').join("　／　");
      return '<div class="hrow"><span class="d">' + esc(d.date.slice(5)) + '</span>'
        + '<span class="t">' + (texts || '<span class="dim">没有记录</span>') + '</span></div>';
    }).join("") : '<div class="empty">还没有历史</div>';
  }

  async function load() {
    try {
      const data = await get("today");
      if (!data || !data.ok) throw new Error("读取失败");
      state = data;
      render();
    } catch (e) {
      $("banner").classList.add("show");
      $("banner").textContent = "加载失败：" + (e && e.message ? e.message : e);
    }
  }

  $("grid").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn || btn.dataset.act !== "said") return;
    const id = btn.closest(".card") && btn.closest(".card").dataset.id;
    if (!id) return;
    const res = await post("said", { id: id });
    if (res && res.ok) { state = Object.assign({ ok: true }, res.state || {}); render(); toast("已标记"); }
    else toast("标记失败", true);
  });

  $("pend").addEventListener("click", async (e) => {
    const box = e.target.closest('[data-act="done"]');
    if (!box) return;
    const id = box.closest(".prow") && box.closest(".prow").dataset.id;
    if (!id) return;
    const res = await post("pending", { id: id });
    if (res && res.ok) { state = Object.assign({ ok: true }, res.state || {}); render(); toast("划掉了"); }
    else toast("操作失败", true);
  });

  $("btn-reroll").onclick = async () => {
    if (!confirm("把今天这几件换掉？")) return;
    const res = await post("reroll", {});
    if (res && res.ok) { state = Object.assign({ ok: true }, res.state || {}); render(); toast("换好了"); }
    else toast("换失败", true);
  };

  $("btn-add-toggle").onclick = () => {
    $("addbox").hidden = !$("addbox").hidden;
    if (!$("addbox").hidden) $("add-input").focus();
  };

  $("btn-add-save").onclick = async () => {
    const text = $("add-input").value.trim();
    if (!text) return toast("写点什么", true);
    const res = await post("add", { text: text });
    if (res && res.ok) {
      $("add-input").value = "";
      $("addbox").hidden = true;
      state = Object.assign({ ok: true }, res.state || {});
      render();
      toast("记下了");
    } else toast("添加失败", true);
  };

  $("add-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-add-save").click(); });
  $("btn-refresh").onclick = load;

  (async () => {
    const ok = await ensureBridge();
    if (!ok) $("banner").classList.add("show");
    if (bridge && bridge.ready) {
      try {
        await bridge.ready();
        const ctx = bridge.getContext && bridge.getContext();
        if (ctx && typeof ctx.isDark === "boolean") {
          document.documentElement.setAttribute("data-theme", ctx.isDark ? "dark" : "light");
        }
      } catch (e) {}
    }
    await load();
  })();
})();
</script>
</body>
</html>
